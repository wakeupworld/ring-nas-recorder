name: ring-nas-recorder

on:
  push:
    branches: [main]
    tags: ["ring-nas-recorder-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push and sign the image on GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ring-nas-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - name: npm audit (fails on unaccepted high/critical)
        run: npm run audit

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ring-nas-recorder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (locked-down mock run)
        run: |
          mkdir -p /tmp/rnr/data /tmp/rnr/rec
          sudo chown 568:568 /tmp/rnr/data /tmp/rnr/rec
          echo mock-token-for-ci > /tmp/rnr/token && chmod 644 /tmp/rnr/token
          docker run --rm --user 568:568 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            -v /tmp/rnr/data:/data -v /tmp/rnr/rec:/recordings \
            -v /tmp/rnr/token:/run/secrets/ring_refresh_token:ro \
            -e MOCK=1 -e CLIP_SECONDS=5 -e MOCK_EVENT_INTERVAL_SECONDS=3 -e EXIT_AFTER_SECONDS=15 \
            ring-nas-recorder:ci 2>&1 | tee /tmp/rnr/log.txt
          test "$(sudo find /tmp/rnr/rec -name '*.mp4' | wc -l)" -ge 1
          test "$(sudo stat -c %a /tmp/rnr/data/refresh-token)" = 600
          ! grep -q mock-token-for-ci /tmp/rnr/log.txt
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ring-nas-recorder:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

  publish:
    needs: image
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ring-nas-recorder
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=ring-nas-recorder-v(.*),group=1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Sign with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ring-nas-recorder
        run: |
          cosign sign --yes "${IMAGE,,}@${DIGEST}"
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE,,}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
